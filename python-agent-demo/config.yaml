# Agent配置
agent:
  name: "PythonAgentDemo"
  version: "1.0.0"
  description: "Python智能代理技能演示项目"
  
  # 技能配置
  skills:
    enabled:
      - greeting
      - calculator
      - weather
      - file_processor
    
    # 技能参数
    greeting:
      default_language: "zh-CN"
      formal_level: "casual"
    
    calculator:
      precision: 6
      allow_complex: true
    
    weather:
      api_key: ""  # 留空使用模拟数据
      default_city: "北京"
    
    file_processor:
      max_file_size: 10485760  # 10MB
      allowed_extensions: [".txt", ".csv", ".json", ".yaml", ".yml"]
  
  # 编排配置
  orchestrator:
    max_retries: 3
    retry_delay: 1.0  # 秒
    timeout: 30.0  # 秒
    enable_task_splitting: true
    max_task_depth: 5
    
  # 日志配置
  logging:
    level: "INFO"
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    file: "logs/agent.log"
    max_size: 10485760  # 10MB
    backup_count: 5
  
  # 性能配置
  performance:
    max_concurrent_tasks: 5
    cache_enabled: true
    cache_ttl: 300  # 5分钟