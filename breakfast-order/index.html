<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>🍳 早餐吃什么</title>
<style>
  :root{
    --bg:#f6f5f3; --card:#ffffff; --ink:#111111; --muted:#8a8580;
    --accent:#111111; --accent-ink:#ffffff; --tint:#f1efe9; --line:#ece9e3;
    --radius:18px; --shadow:0 2px 12px rgba(0,0,0,.05);
    --maxw:720px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;
    padding-bottom:calc(88px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:var(--maxw);margin:0 auto;}

  /* ---------- 顶部 ---------- */
  header{
    background:var(--bg);padding:calc(18px + env(safe-area-inset-top)) 18px 12px;
    position:sticky;top:0;z-index:20;
  }
  header .brand{display:flex;align-items:center;gap:10px;}
  header .logo{width:38px;height:38px;border-radius:12px;background:var(--ink);color:#fff;
    display:grid;place-items:center;font-size:20px;flex-shrink:0;}
  header h1{margin:0;font-size:21px;font-weight:800;letter-spacing:.3px;}
  header .sub{margin:2px 0 0;font-size:12px;color:var(--muted);}
  header .date{margin-left:auto;font-size:12px;color:var(--muted);background:#fff;
    padding:6px 11px;border-radius:999px;box-shadow:var(--shadow);white-space:nowrap;}
  .hdr-btns{margin-left:auto;display:flex;gap:8px;}
  .hdr-btns button{border:none;background:#fff;box-shadow:var(--shadow);border-radius:999px;
    padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap;}
  .hdr-btns button:active{transform:scale(.96);}

  /* ---------- 名字 ---------- */
  .who{display:flex;align-items:center;gap:10px;margin-top:14px;background:#fff;border-radius:var(--radius);
    padding:12px 14px;box-shadow:var(--shadow);}
  .who .icon{font-size:18px;}
  .who input{flex:1;border:none;outline:none;font-size:15px;background:transparent;color:var(--ink);}
  .who input::placeholder{color:#b5b0a8;}

  /* ---------- 分类tab ---------- */
  .tabs{display:flex;gap:8px;padding:4px 18px 10px;overflow-x:auto;position:sticky;top:0;
    background:var(--bg);z-index:15;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto;border:none;background:#fff;color:var(--muted);padding:8px 15px;border-radius:999px;
    font-size:13.5px;font-weight:600;cursor:pointer;box-shadow:var(--shadow);transition:.15s;white-space:nowrap;}
  .tab.on{background:var(--ink);color:#fff;}

  /* ---------- 内容 ---------- */
  main{padding:6px 18px 0;}
  .cat{margin-bottom:22px;scroll-margin-top:96px;}
  .cat h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
  .cat h2 .dot{width:6px;height:6px;border-radius:50%;background:var(--ink);}
  .cat h2 .badge{margin-left:auto;font-size:11px;font-weight:600;color:var(--accent-ink);
    background:var(--ink);padding:2px 8px;border-radius:999px;}

  .grid{display:grid;grid-template-columns:1fr;gap:10px;}
  .item{background:var(--card);border-radius:var(--radius);padding:14px;display:flex;align-items:center;gap:14px;
    box-shadow:var(--shadow);border:1.5px solid transparent;transition:.15s;cursor:pointer;}
  .item:active{transform:scale(.985);}
  .item.on{border-color:var(--ink);}
  .item .thumb{width:52px;height:52px;border-radius:14px;background:var(--tint);display:grid;place-items:center;
    font-size:26px;flex-shrink:0;}
  .item .info{flex:1;min-width:0;}
  .item .nm{font-size:15px;font-weight:700;line-height:1.3;}
  .item .ds{font-size:12px;color:var(--muted);margin-top:3px;}

  .stepper{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .stepper button{width:30px;height:30px;border-radius:50%;border:none;font-size:18px;font-weight:700;
    line-height:1;cursor:pointer;display:grid;place-items:center;transition:.12s;}
  .stepper button:active{transform:scale(.9);}
  .stepper .minus{background:var(--tint);color:var(--ink);}
  .stepper .plus{background:var(--ink);color:#fff;}
  .stepper .q{min-width:18px;text-align:center;font-size:15px;font-weight:800;}

  /* ---------- 底部栏 ---------- */
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    padding:12px 18px calc(12px + env(safe-area-inset-bottom));}
  .bar .inner{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:12px;}
  .bar .left{flex:1;min-width:0;}
  .bar .l1{font-size:12px;color:var(--muted);}
  .bar .l2{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
  .bar button{border:none;border-radius:999px;font-size:15.5px;font-weight:700;padding:13px 22px;cursor:pointer;
    transition:.12s;white-space:nowrap;}
  .bar button:active{transform:scale(.97);}
  .btn-ghost{background:var(--tint);color:var(--ink);}
  .btn-main{background:var(--ink);color:#fff;box-shadow:0 6px 16px rgba(17,17,17,.25);}

  /* ---------- 今日已点提示 ---------- */
  .today-box{margin:12px 0 0;padding:12px 14px;border-radius:14px;background:#fff8e8;border:1px solid #ffe3a3;
    font-size:14px;line-height:1.5;color:#8a6d1f;display:none;}
  .today-box .tb-t{font-weight:700;margin-bottom:2px;color:#b8860b;}
  .today-box .tb-n{color:#111;font-weight:600;}

  /* ---------- toast ---------- */
  #toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);background:rgba(17,17,17,.94);
    color:#fff;padding:14px 24px;border-radius:16px;font-size:15px;font-weight:600;opacity:0;pointer-events:none;
    transition:.22s;z-index:99;max-width:80%;text-align:center;line-height:1.4;}
  #toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}

  /* ---------- 弹窗 ---------- */
  #modal{position:fixed;inset:0;background:rgba(17,17,17,.45);display:none;align-items:flex-end;z-index:100;}
  #modal.show{display:flex;}
  .sheet{background:#fff;width:100%;max-width:var(--maxw);margin:0 auto;border-radius:24px 24px 0 0;
    padding:22px 18px calc(22px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto;
    animation:up .28s cubic-bezier(.2,.8,.2,1);}
  @keyframes up{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .sheet .handle{width:40px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 16px;}
  .sheet h3{margin:0 0 14px;font-size:18px;font-weight:800;}
  .mk{white-space:pre-wrap;font-size:13.5px;line-height:1.75;background:var(--tint);border-radius:16px;padding:16px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#3a352f;}
  .sheet .acts{display:flex;gap:10px;margin-top:16px;}
  .sheet .acts button{flex:1;border:none;border-radius:14px;padding:14px;font-size:15px;
    font-weight:700;cursor:pointer;transition:.12s;}
  .sheet .acts button:active{transform:scale(.98);}
  .copy{background:var(--ink);color:#fff;}
  .close{background:var(--tint);color:var(--ink);}

  /* ---------- 日历 ---------- */
  #histModal{position:fixed;inset:0;background:rgba(17,17,17,.45);display:none;align-items:flex-end;z-index:100;}
  #histModal.show{display:flex;}
  @keyframes sheetUp{from{transform:translateY(24px);opacity:.4}to{transform:translateY(0);opacity:1}}
  #histModal.show .sheet{animation:sheetUp .3s cubic-bezier(.22,1,.36,1) both;}
  .sheet{position:relative;}
  .sheet-x{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;border:2px solid #fff;
    background:linear-gradient(135deg,#ffd7a8,#ffb27a);color:#7a4a1d;font-size:17px;cursor:pointer;line-height:1;
    display:flex;align-items:center;justify-content:center;z-index:5;
    box-shadow:0 3px 10px rgba(255,150,90,.35);transition:transform .15s ease, box-shadow .15s ease;}
  .sheet-x:hover{transform:rotate(90deg) scale(1.08);box-shadow:0 5px 16px rgba(255,150,90,.5);}
  .sheet-x:active{transform:scale(.88) rotate(-15deg);}
  @keyframes xpop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
  #histModal.show .sheet-x{animation:xpop .35s cubic-bezier(.34,1.56,.64,1) both;}
  .sheet-x:active{transform:scale(.94);}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .cal-head span{font-size:16px;font-weight:800;}
  .cal-head button{width:34px;height:34px;border-radius:50%;border:none;background:var(--tint);
    font-size:18px;font-weight:700;cursor:pointer;line-height:1;}
  .cal-week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;
    color:var(--muted);margin-bottom:6px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-cell{aspect-ratio:1/1;border-radius:12px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;font-size:13px;background:var(--bg);color:var(--text);position:relative;}
  .cal-cell.empty{background:transparent;}
  .cal-cell.out{opacity:.28;}
  .cal-cell.has{background:var(--ink);color:#fff;font-weight:700;cursor:pointer;}
  .cal-cell.today{box-shadow:inset 0 0 0 2px var(--ink);}
  .cal-cell .dot{width:4px;height:4px;border-radius:50%;background:#fff;position:absolute;bottom:6px;}
  .cal-cell .dnum{line-height:1;}
  #histDetail{overflow:hidden;max-height:0;opacity:0;transform:translateY(6px);
    transition:max-height .32s cubic-bezier(.4,0,.2,1), opacity .3s ease, transform .3s ease;}

  /* ---------- 响应式：平板/桌面 ---------- */
  @media(min-width:560px){
    .grid{grid-template-columns:repeat(2,1fr);}
    header h1{font-size:23px;}
  }
  @media(min-width:860px){
    :root{--maxw:920px;}
    .grid{grid-template-columns:repeat(3,1fr);}
    body{padding-bottom:100px;}
    .bar .inner{padding:0 4px;}
  }
  /* 横屏手机 */
  @media(max-height:500px) and (orientation:landscape){
    header{padding-top:12px;}
    .grid{grid-template-columns:repeat(3,1fr);}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">🍳</div>
      <div>
        <h1>早餐吃什么呀</h1>
        <p class="sub">挑好想吃的，好好吃饭长高高 🌱</p>
      </div>
      <div class="hdr-btns">
        <button id="histBtn">📖 回忆</button>
      </div>
    </div>
    <div class="who" id="whoBar" style="display:none">
      <span class="icon">👤</span>
      <input id="nameInput" placeholder="输入你的名字" maxlength="20">
    </div>
    <div id="todayBox" class="today-box" style="display:none"></div>
  </header>

  <div class="tabs" id="tabs"></div>
  <main id="menu"></main>

  <div class="bar">
    <div class="inner">
      <div class="left">
        <div class="l1" id="cnt">还没选</div>
        <div class="l2" id="picked">—</div>
      </div>
      <button id="submitBtn" class="btn-main">就吃这些啦！</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<div id="modal">
  <div class="sheet">
    <div class="handle"></div>
    <h3>🍳 明天吃什么呀</h3>
    <div class="mk" id="menuText"></div>
    <div class="acts">
      <button class="close" id="closeModal">关闭</button>
      <button class="copy" id="copyBtn">复制菜单</button>
    </div>
  </div>
</div>

<div id="histModal">
  <div class="sheet">
    <button class="sheet-x" id="closeHist" aria-label="关闭">🙈</button>
    <div class="handle"></div>
    <h3>🍳 最近吃过啥</h3>
    <div class="cal-head">
      <button id="calPrev">‹</button>
      <span id="calTitle"></span>
      <button id="calNext">›</button>
    </div>
    <div class="cal-week">
      <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="mk" id="histDetail" style="margin-top:14px;display:none"></div>
  </div>
</div>

<script>
const API = location.pathname.startsWith('/breakfast') ? (location.origin + '/breakfast') : location.origin;
let MENU = null;
let CART = {};   // id -> qty

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1600);
}
function findItem(id){
  for(const c of MENU.categories) for(const it of c.items) if(it.id===id) return it;
  return null;
}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function renderTabs(){
  const el=document.getElementById('tabs');
  el.innerHTML='';
  for(const cat of MENU.categories){
    const b=document.createElement('button');
    b.className='tab';
    b.textContent=`${cat.icon} ${cat.name}`;
    b.onclick=()=>{
      const t=document.getElementById('cat_'+cat.id);
      if(t) t.scrollIntoView({behavior:'smooth',block:'start'});
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
    };
    el.appendChild(b);
  }
  if(el.firstChild) el.firstChild.classList.add('on');
}

function render(){
  const root=document.getElementById('menu');
  root.innerHTML='';
  for(const cat of MENU.categories){
    const sec=document.createElement('section');
    sec.className='cat';sec.id='cat_'+cat.id;
    const cnt=cat.items.reduce((a,it)=>a+(CART[it.id]||0),0);
    sec.innerHTML=`<h2><span class="dot"></span>${cat.icon} ${cat.name}${cnt?`<span class="badge">想要 ${cnt}</span>`:''}</h2>`;
    const grid=document.createElement('div');
    grid.className='grid';
    for(const it of cat.items){
      const q=CART[it.id]||0;
      const el=document.createElement('div');
      el.className='item'+(q>0?' on':'');
      el.innerHTML=`
        <div class="thumb">${it.emoji||'🍽'}</div>
        <div class="info">
          <div class="nm">${esc(it.name)}</div>
          <div class="ds">${esc(it.desc||'')}</div>
        </div>
        <div class="stepper">
          <button class="minus" ${q>0?'':'style="visibility:hidden"'}>−</button>
          <span class="q">${q>0?q:''}</span>
          <button class="plus">+</button>
        </div>`;
      el.querySelector('.plus').onclick=(e)=>{e.stopPropagation();addItem(it);};
      el.querySelector('.minus').onclick=(e)=>{e.stopPropagation();
        if(CART[it.id]){CART[it.id]--;if(CART[it.id]<=0)delete CART[it.id];render();}};
      el.onclick=()=>addItem(it);
      grid.appendChild(el);
    }
    sec.appendChild(grid);
    root.appendChild(sec);
  }
  updateBar();
}

function addItem(it){
  if(it.id==='o1'){
    const v=prompt('想吃什么？（输入菜名）','');
    if(!v||!v.trim())return;
    const k='c_'+v.trim();
    CART[k]=(CART[k]||0)+1;render();return;
  }
  CART[it.id]=(CART[it.id]||0)+1;render();
}

function cartList(){
  const arr=[];
  for(const id in CART){
    if(id.startsWith('c_')){arr.push({id,name:id.slice(2),emoji:'✍️',price:0,qty:CART[id]});continue;}
    const it=findItem(id);
    if(it) arr.push({id,name:it.name,emoji:it.emoji||'🍽',price:it.price||0,qty:CART[id]});
  }
  return arr;
}

function updateBar(){
  const list=cartList();
  const n=list.reduce((a,b)=>a+b.qty,0);
  document.getElementById('cnt').textContent=n?`想吃了 ${n} 样 😋`:'还没挑呢～';
  const names=list.map(x=>x.qty>1?`${x.name}×${x.qty}`:x.name).join('、');
  document.getElementById('picked').textContent=names||'—';
}

async function submit(){
  const name=USER_NAME;   // 只有一位用户「仁仁」
  const items=cartList();
  if(!items.length){toast('至少挑一样想吃的嘛 🥺');return;}
  try{
    const r=await fetch(API+'/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name,items})});
    const d=await r.json();
    if(!d.ok){toast(d.error||'哎呀，没送出去');return;}
    toast('✅ 好啦！明早等着吃吧～');
    CART={};render();
    showTodayBox(name);
    showMenu(d.daily_menu);
  }catch(e){toast('网络开小差了，再点一次吧');}
}

function menuToText(m){
  let s=`🍳 明天吃什么呀 (${m.date})\n`;
  s+=`👥 ${m.total_people} 人 · 一共 ${m.total_items} 样\n`;
  s+=`——————\n`;
  if(!m.summary.length){s+='（大家还没挑呢～）\n';return s;}
  for(const it of m.summary) s+=`${it.emoji||'🍽'} ${it.name} ×${it.qty}\n`;
  s+=`——————\n👤 谁想吃啥：\n`;
  for(const p of m.per_person){
    const list=p.items.map(i=>`${i.name}${i.qty>1?'×'+i.qty:''}`).join('、');
    const t=p.ts?`  🕐 ${p.ts.slice(11,16)}`:'';
    s+=`· ${p.name}：${list}${t}\n`;
  }
  return s;
}

function showMenu(m){
  const fill=(mm)=>{
    document.getElementById('menuText').textContent=menuToText(mm);
    document.getElementById('modal').classList.add('show');
  };
  if(m) fill(m);
  else fetch(API+'/api/daily-menu').then(r=>r.json()).then(fill);
}

document.getElementById('submitBtn').onclick=submit;
document.getElementById('closeModal').onclick=()=>document.getElementById('modal').classList.remove('show');
document.getElementById('modal').onclick=(e)=>{if(e.target.id==='modal')e.currentTarget.classList.remove('show');};
document.getElementById('copyBtn').onclick=async()=>{
  const txt=document.getElementById('menuText').textContent;
  try{await navigator.clipboard.writeText(txt);toast('抄好啦，可以贴给别人看');}
  catch(e){toast('长按文字手动复制也行哦');}
};

/* 只有一位用户「仁仁」，无需填名字 */
const USER_NAME='仁仁';

/* ===== 今日已点提示 + 自动勾选 ===== */
let todayLoaded=false;
function showTodayBox(name){
  const box=document.getElementById('todayBox');
  if(!name){box.style.display='none';return;}
  fetch(API+'/api/orders').then(r=>r.json()).then(d=>{
    const od=(d.orders||{})[name];
    if(od && od.items && od.items.length){
      const list=od.items.map(i=>`${i.emoji||'🍽'}${i.name}${i.qty>1?'×'+i.qty:''}`).join('、');
      box.innerHTML=`<div class="tb-t">🥰 今天已经挑好啦，帮小肚子记着呢</div>`
        +`<div>就想吃：<span class="tb-n">${list}</span></div>`
        +`<div style="margin-top:4px;color:#a08a4a">改主意啦？在下面点点，再喊一声「就吃这些啦！」就好 👇</div>`;
      box.style.display='block';
      // 自动把已点项填进购物车
      CART={};
      for(const it of od.items){ if(it.id) CART[it.id]=it.qty||1; }
      if(typeof MENU!=='undefined' && MENU && MENU.categories) render();
      todayLoaded=true;
    }else{
      box.style.display='none';
    }
  }).catch(()=>{box.style.display='none';});
}
fetch(API+'/api/menu').then(r=>r.json()).then(d=>{MENU=d.menu;renderTabs();render();
  showTodayBox(USER_NAME);
});

/* ================= 日历历史 ================= */
let HIST = {};           // {date: {count, people, preview}}
let calYear, calMonth;   // 当前显示的年月
const HIST_DAYS = 30;    // 只保留最近30天

function ymd(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function dayStr(dt){return dt.toISOString().slice(0,10);}
function cutoffStr(){        // 30天窗口最早那天(含)
  const c=new Date(); c.setHours(0,0,0,0); c.setDate(c.getDate()-(HIST_DAYS-1));
  return dayStr(c);
}

async function openHist(){
  // 先立刻显示弹窗和日历（用已有缓存），避免点击卡顿
  const now=new Date();
  calYear=now.getFullYear();calMonth=now.getMonth();
  renderCal();
  document.getElementById('histModal').classList.add('show');
  document.getElementById('histDetail').style.display='none';
  // 后台拉取历史，回来再刷新
  try{
    const r=await fetch(API+'/api/history');
    const d=await r.json();
    HIST=d.days||{};
    renderCal();
  }catch(e){/* 保留已渲染的日历 */}
}

// 用 DOM 拼片段一次性插入，减少重排
function renderCal(){
  const grid=document.getElementById('calGrid');
  const title=document.getElementById('calTitle');
  title.textContent=`${calYear}年 ${calMonth+1}月`;
  const frag=document.createDocumentFragment();
  const first=new Date(calYear,calMonth,1);
  let startIdx=(first.getDay()+6)%7;  // 周一=0
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const todayStr=dayStr(new Date());
  const cut=cutoffStr();
  for(let i=0;i<startIdx;i++){
    const c=document.createElement('div');c.className='cal-cell empty';frag.appendChild(c);
  }
  for(let d=1;d<=daysInMonth;d++){
    const ds=ymd(calYear,calMonth,d);
    const info=HIST[ds];
    const inWindow = ds>=cut && ds<=todayStr;   // 只在最近30天内可选
    const c=document.createElement('div');
    c.className='cal-cell'+(info&&inWindow?' has':'')+(ds===todayStr?' today':'');
    // 用 textContent 拼装，避免解析 innerHTML
    const dn=document.createElement('span');dn.className='dnum';dn.textContent=d;c.appendChild(dn);
    if(info&&inWindow){
      const dot=document.createElement('span');dot.className='dot';c.appendChild(dot);
      c.onclick=()=>showHistDay(ds);
      c.title=info.preview||'';
    }else if(!inWindow){
      c.classList.add('out');
    }
    frag.appendChild(c);
  }
  grid.replaceChildren(frag);
}

async function showHistDay(ds){
  const det=document.getElementById('histDetail');
  // 平滑收起（如果已展开）
  det.style.maxHeight='0';
  det.style.opacity='0';
  det.style.transform='translateY(6px)';
  let text='';
  try{
    const r=await fetch(API+'/api/history?date='+ds);
    const d=await r.json();
    text=menuToText(d.menu);
  }catch(e){text='呃…没打开，等下再试试';}
  det.textContent=text;
  det.style.display='block';
  // 强制回流后展开，触发过渡
  requestAnimationFrame(()=>{
    det.style.maxHeight=det.scrollHeight+'px';
    det.style.opacity='1';
    det.style.transform='translateY(0)';
  });
}

document.getElementById('histBtn').onclick=openHist;
document.getElementById('closeHist').onclick=()=>document.getElementById('histModal').classList.remove('show');
// 只在最近30天窗口内翻月，超出则按钮禁用
function inWindowMonth(y,m){
  const cand=new Date(y,m+1,0);            // 该月最后一天
  return dayStr(cand)>=cutoffStr() && dayStr(new Date(y,m,1))<=dayStr(new Date());
}
function updateNav(){
  const prevOut = !inWindowMonth(calMonth===0?calYear-1:calYear, calMonth===0?11:calMonth-1);
  const nextOut = !inWindowMonth(calMonth===11?calYear+1:calYear, calMonth===11?0:calMonth+1);
  const p=document.getElementById('calPrev'), n=document.getElementById('calNext');
  p.disabled=prevOut; p.style.opacity=prevOut?.3:1; p.style.cursor=prevOut?'default':'pointer';
  n.disabled=nextOut; n.style.opacity=nextOut?.3:1; n.style.cursor=nextOut?'default':'pointer';
}
const _renderCal=renderCal;
renderCal=function(){_renderCal();updateNav();};document.getElementById('calPrev').onclick=()=>{calMonth--;if(calMonth<0){calMonth=11;calYear--;}renderCal();};
document.getElementById('calNext').onclick=()=>{calMonth++;if(calMonth>11){calMonth=0;calYear++;}renderCal();};

/* 顶部日期徽章（移除后放到哪里？改为不显示） */

/* 点击遮罩（弹窗外任意位置）关闭弹窗 */
['modal','histModal'].forEach(id=>{
  const m=document.getElementById(id);
  m.addEventListener('click',e=>{ if(e.target===m) m.classList.remove('show'); });
});
