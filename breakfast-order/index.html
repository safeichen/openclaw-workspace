<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🥣 早餐点单</title>
<style>
  :root{
    --bg:#fff8f0; --card:#ffffff; --primary:#ff8a3d; --primary-d:#f26a1a;
    --text:#33302e; --muted:#938b84; --line:#f0e6dc; --ok:#2eb872;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);padding-bottom:96px;}
  header{background:linear-gradient(135deg,#ffb56b,#ff8a3d);color:#fff;padding:20px 16px 22px;
    border-radius:0 0 22px 22px;box-shadow:0 6px 18px rgba(255,138,61,.25);position:sticky;top:0;z-index:10;}
  header h1{margin:0;font-size:20px;letter-spacing:1px;}
  header p{margin:6px 0 0;font-size:12.5px;opacity:.95;}
  .who{display:flex;gap:8px;margin-top:14px;}
  .who input{flex:1;border:none;border-radius:12px;padding:11px 14px;font-size:15px;outline:none;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.6);}
  .who input::placeholder{color:#c4a892;}
  main{padding:14px 14px 0;}
  .cat{margin-bottom:18px;}
  .cat h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:6px;color:var(--text);}
  .cat h2 .badge{font-size:11px;color:var(--muted);font-weight:400;margin-left:auto;}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .item{background:var(--card);border-radius:16px;padding:12px;display:flex;align-items:center;gap:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.04);border:1.5px solid transparent;transition:.15s;cursor:pointer;}
  .item:active{transform:scale(.97);}
  .item.on{border-color:var(--primary);background:#fff4ec;}
  .item .emo{font-size:26px;line-height:1;flex-shrink:0;}
  .item .info{flex:1;min-width:0;}
  .item .nm{font-size:14px;font-weight:600;}
  .item .ds{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item .pr{font-size:12px;color:var(--primary-d);font-weight:600;margin-top:3px;}
  .stepper{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .stepper button{width:24px;height:24px;border-radius:8px;border:none;background:var(--line);color:var(--text);
    font-size:16px;font-weight:700;line-height:1;cursor:pointer;}
  .stepper button.plus{background:var(--primary);color:#fff;}
  .stepper .q{min-width:16px;text-align:center;font-size:14px;font-weight:600;}
  .summary{background:var(--card);border-radius:16px;padding:14px;margin:6px 0 16px;box-shadow:0 2px 8px rgba(0,0,0,.04);}
  .summary h3{margin:0 0 10px;font-size:14px;}
  .summary .row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;color:#5a544f;}
  .summary .row span:last-child{color:var(--muted);}
  .summary .tot{display:flex;justify-content:space-between;font-size:15px;font-weight:700;
    margin-top:8px;padding-top:10px;border-top:1px dashed var(--line);color:var(--primary-d);}
  .bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);
    padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;
    box-shadow:0 -4px 16px rgba(0,0,0,.06);}
  .bar .left{flex:1;display:flex;flex-direction:column;justify-content:center;}
  .bar .left .l1{font-size:12px;color:var(--muted);}
  .bar .left .l2{font-size:17px;font-weight:800;color:var(--primary-d);}
  .bar button{border:none;border-radius:14px;padding:0 20px;font-size:16px;font-weight:700;color:#fff;
    background:linear-gradient(135deg,#ffb56b,#f26a1a);cursor:pointer;box-shadow:0 4px 12px rgba(242,106,26,.35);}
  .bar button:active{transform:scale(.97);}
  .btn-ghost{background:none!important;color:var(--muted)!important;box-shadow:none!important;padding:0 10px!important;font-weight:500!important;}
  /* toast */
  #toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);background:rgba(30,28,26,.92);
    color:#fff;padding:14px 22px;border-radius:14px;font-size:15px;opacity:0;pointer-events:none;transition:.22s;z-index:99;max-width:80%;text-align:center;}
  #toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
  /* modal */
  #modal{position:fixed;inset:0;background:rgba(30,28,26,.5);display:none;align-items:flex-end;z-index:100;}
  #modal.show{display:flex;}
  .sheet{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));
    max-height:80vh;overflow:auto;animation:up .25s ease;}
  @keyframes up{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .sheet h3{margin:0 0 14px;font-size:16px;}
  .mk{white-space:pre-wrap;font-size:13.5px;line-height:1.7;background:#faf5ef;border-radius:14px;padding:14px;
    font-family:-apple-system,"PingFang SC",monospace;color:#4a443f;}
  .sheet .acts{display:flex;gap:10px;margin-top:14px;}
  .sheet .acts button{flex:1;border:none;border-radius:14px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;}
  .copy{background:var(--primary);color:#fff;}
  .close{background:var(--line);color:var(--text);}
</style>
</head>
<body>
<header>
  <h1>🥣 早餐点单</h1>
  <p>选好想吃的，提交后自动汇总成每日早餐菜单</p>
  <div class="who">
    <input id="nameInput" placeholder="输入你的名字（微信/QQ 昵称即可）" maxlength="20">
  </div>
</header>

<main id="menu"></main>

<div class="bar">
  <div class="left">
    <div class="l1" id="cnt">已选 0 样</div>
    <div class="l2" id="price">¥0</div>
  </div>
  <button id="genBtn" class="btn-ghost">菜单</button>
  <button id="submitBtn">提交点单</button>
</div>

<div id="toast"></div>
<div id="modal">
  <div class="sheet">
    <h3>📋 每日早餐菜单</h3>
    <div class="mk" id="menuText"></div>
    <div class="acts">
      <button class="close" id="closeModal">关闭</button>
      <button class="copy" id="copyBtn">复制菜单</button>
    </div>
  </div>
</div>

<script>
// 自动适配：在 /breakfast/ 子路径或独立端口下都能用
const API = location.pathname.startsWith('/breakfast') ? (location.origin + '/breakfast') : location.origin;
let MENU = null;
let CART = {};   // id -> qty

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1600);
}

function findItem(id){
  for(const c of MENU.categories) for(const it of c.items) if(it.id===id) return it;
  return null;
}

function render(){
  const root=document.getElementById('menu');
  root.innerHTML='';
  for(const cat of MENU.categories){
    const sec=document.createElement('section');
    sec.className='cat';
    let picked=cat.items.some(it=>CART[it.id]);
    sec.innerHTML=`<h2>${cat.icon} ${cat.name}<span class="badge">${picked?'已选':''}</span></h2>`;
    const grid=document.createElement('div');
    grid.className='grid';
    for(const it of cat.items){
      const q=CART[it.id]||0;
      const el=document.createElement('div');
      el.className='item'+(q>0?' on':'');
      el.innerHTML=`
        <div class="emo">${it.emoji||'🍽'}</div>
        <div class="info">
          <div class="nm">${it.name}</div>
          <div class="ds">${it.desc||''}</div>
          <div class="pr">¥${it.price}</div>
        </div>
        <div class="stepper">
          <button class="minus" ${q>0?'':'style="visibility:hidden"'}>−</button>
          <span class="q">${q>0?q:''}</span>
          <button class="plus">+</button>
        </div>`;
      el.querySelector('.plus').onclick=(e)=>{e.stopPropagation();CART[it.id]=(CART[it.id]||0)+1;render();};
      el.querySelector('.minus').onclick=(e)=>{e.stopPropagation();
        if(CART[it.id]){CART[it.id]--;if(CART[it.id]<=0)delete CART[it.id];render();}};
      el.onclick=()=>{CART[it.id]=(CART[it.id]||0)+1;render();};
      grid.appendChild(el);
    }
    sec.appendChild(grid);
    root.appendChild(sec);
  }
  updateBar();
}

function cartList(){
  const arr=[];
  for(const id in CART){
    const it=findItem(id);
    if(it) arr.push({id,name:it.name,emoji:it.emoji||'🍽',price:it.price,qty:CART[id]});
  }
  return arr;
}

function updateBar(){
  const list=cartList();
  const n=list.reduce((a,b)=>a+b.qty,0);
  const p=list.reduce((a,b)=>a+b.price*b.qty,0);
  document.getElementById('cnt').textContent=`已选 ${n} 样`;
  document.getElementById('price').textContent=`¥${p}`;
}

async function submit(){
  const name=document.getElementById('nameInput').value.trim();
  if(!name){toast('请先填写名字');return;}
  const items=cartList();
  if(!items.length){toast('请至少选一样早餐');return;}
  try{
    const r=await fetch(API+'/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name,items})});
    const d=await r.json();
    if(!d.ok){toast(d.error||'提交失败');return;}
    toast('✅ 提交成功！');
    CART={};render();
    showMenu(d.daily_menu,true);
  }catch(e){toast('网络错误，请重试');}
}

function menuToText(m){
  let s=`🍳 每日早餐菜单 (${m.date})\n`;
  s+=`👥 ${m.total_people} 人 · ${m.total_items} 份 · 合计 ¥${m.total_price}\n`;
  s+=`——————\n`;
  if(!m.summary.length){s+='（还没有人点单）\n';return s;}
  for(const it of m.summary){
    s+=`${it.emoji||'🍽'} ${it.name} ×${it.qty}  ¥${it.price*it.qty}\n`;
  }
  s+=`——————\n👤 各人明细：\n`;
  for(const p of m.per_person){
    const list=p.items.map(i=>`${i.name}${i.qty>1?'×'+i.qty:''}`).join('、');
    s+=`· ${p.name}：${list}（¥${p.total}）\n`;
  }
  return s;
}

function showMenu(m,isNew){
  m=m||null;
  const fill=(mm)=>{
    document.getElementById('menuText').textContent=menuToText(mm);
    document.getElementById('modal').classList.add('show');
  };
  if(m) fill(m);
  else fetch(API+'/api/daily-menu').then(r=>r.json()).then(fill);
}

document.getElementById('submitBtn').onclick=submit;
document.getElementById('genBtn').onclick=()=>showMenu(null);
document.getElementById('closeModal').onclick=()=>document.getElementById('modal').classList.remove('show');
document.getElementById('modal').onclick=(e)=>{if(e.target.id==='modal')e.currentTarget.classList.remove('show');};
document.getElementById('copyBtn').onclick=async()=>{
  const txt=document.getElementById('menuText').textContent;
  try{await navigator.clipboard.writeText(txt);toast('已复制菜单');}
  catch(e){toast('长按文本手动复制');}
};

// 记住名字
const saved=localStorage.getItem('bf_name');
if(saved) document.getElementById('nameInput').value=saved;
document.getElementById('nameInput').addEventListener('change',e=>localStorage.setItem('bf_name',e.target.value.trim()));

// 初始化
fetch(API+'/api/menu').then(r=>r.json()).then(d=>{MENU=d.menu;render();});
</script>
</body>
</html>
