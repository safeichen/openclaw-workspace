<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>早餐点单</title>
<style>
  :root{
    --bg:#f6f5f3; --card:#ffffff; --ink:#111111; --muted:#8a8580;
    --accent:#111111; --accent-ink:#ffffff; --tint:#f1efe9; --line:#ece9e3;
    --radius:18px; --shadow:0 2px 12px rgba(0,0,0,.05);
    --maxw:720px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;
    padding-bottom:calc(88px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:var(--maxw);margin:0 auto;}

  /* ---------- 顶部 ---------- */
  header{
    background:var(--bg);padding:calc(18px + env(safe-area-inset-top)) 18px 12px;
    position:sticky;top:0;z-index:20;
  }
  header .brand{display:flex;align-items:center;gap:10px;}
  header .logo{width:38px;height:38px;border-radius:12px;background:var(--ink);color:#fff;
    display:grid;place-items:center;font-size:20px;flex-shrink:0;}
  header h1{margin:0;font-size:21px;font-weight:800;letter-spacing:.3px;}
  header .sub{margin:2px 0 0;font-size:12px;color:var(--muted);}
  header .date{margin-left:auto;font-size:12px;color:var(--muted);background:#fff;
    padding:6px 11px;border-radius:999px;box-shadow:var(--shadow);white-space:nowrap;}

  /* ---------- 名字 ---------- */
  .who{display:flex;align-items:center;gap:10px;margin-top:14px;background:#fff;border-radius:var(--radius);
    padding:12px 14px;box-shadow:var(--shadow);}
  .who .icon{font-size:18px;}
  .who input{flex:1;border:none;outline:none;font-size:15px;background:transparent;color:var(--ink);}
  .who input::placeholder{color:#b5b0a8;}

  /* ---------- 分类tab ---------- */
  .tabs{display:flex;gap:8px;padding:4px 18px 10px;overflow-x:auto;position:sticky;top:0;
    background:var(--bg);z-index:15;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto;border:none;background:#fff;color:var(--muted);padding:8px 15px;border-radius:999px;
    font-size:13.5px;font-weight:600;cursor:pointer;box-shadow:var(--shadow);transition:.15s;white-space:nowrap;}
  .tab.on{background:var(--ink);color:#fff;}

  /* ---------- 内容 ---------- */
  main{padding:6px 18px 0;}
  .cat{margin-bottom:22px;scroll-margin-top:96px;}
  .cat h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
  .cat h2 .dot{width:6px;height:6px;border-radius:50%;background:var(--ink);}
  .cat h2 .badge{margin-left:auto;font-size:11px;font-weight:600;color:var(--accent-ink);
    background:var(--ink);padding:2px 8px;border-radius:999px;}

  .grid{display:grid;grid-template-columns:1fr;gap:10px;}
  .item{background:var(--card);border-radius:var(--radius);padding:14px;display:flex;align-items:center;gap:14px;
    box-shadow:var(--shadow);border:1.5px solid transparent;transition:.15s;cursor:pointer;}
  .item:active{transform:scale(.985);}
  .item.on{border-color:var(--ink);}
  .item .thumb{width:52px;height:52px;border-radius:14px;background:var(--tint);display:grid;place-items:center;
    font-size:26px;flex-shrink:0;}
  .item .info{flex:1;min-width:0;}
  .item .nm{font-size:15px;font-weight:700;line-height:1.3;}
  .item .ds{font-size:12px;color:var(--muted);margin-top:3px;}

  .stepper{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .stepper button{width:30px;height:30px;border-radius:50%;border:none;font-size:18px;font-weight:700;
    line-height:1;cursor:pointer;display:grid;place-items:center;transition:.12s;}
  .stepper button:active{transform:scale(.9);}
  .stepper .minus{background:var(--tint);color:var(--ink);}
  .stepper .plus{background:var(--ink);color:#fff;}
  .stepper .q{min-width:18px;text-align:center;font-size:15px;font-weight:800;}

  /* ---------- 底部栏 ---------- */
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    padding:12px 18px calc(12px + env(safe-area-inset-bottom));}
  .bar .inner{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:12px;}
  .bar .left{flex:1;min-width:0;}
  .bar .l1{font-size:12px;color:var(--muted);}
  .bar .l2{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
  .bar button{border:none;border-radius:999px;font-size:15.5px;font-weight:700;padding:13px 22px;cursor:pointer;
    transition:.12s;white-space:nowrap;}
  .bar button:active{transform:scale(.97);}
  .btn-ghost{background:var(--tint);color:var(--ink);}
  .btn-main{background:var(--ink);color:#fff;box-shadow:0 6px 16px rgba(17,17,17,.25);}

  /* ---------- toast ---------- */
  #toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);background:rgba(17,17,17,.94);
    color:#fff;padding:14px 24px;border-radius:16px;font-size:15px;font-weight:600;opacity:0;pointer-events:none;
    transition:.22s;z-index:99;max-width:80%;text-align:center;line-height:1.4;}
  #toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}

  /* ---------- 弹窗 ---------- */
  #modal{position:fixed;inset:0;background:rgba(17,17,17,.45);display:none;align-items:flex-end;z-index:100;}
  #modal.show{display:flex;}
  .sheet{background:#fff;width:100%;max-width:var(--maxw);margin:0 auto;border-radius:24px 24px 0 0;
    padding:22px 18px calc(22px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto;
    animation:up .28s cubic-bezier(.2,.8,.2,1);}
  @keyframes up{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .sheet .handle{width:40px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 16px;}
  .sheet h3{margin:0 0 14px;font-size:18px;font-weight:800;}
  .mk{white-space:pre-wrap;font-size:13.5px;line-height:1.75;background:var(--tint);border-radius:16px;padding:16px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#3a352f;}
  .sheet .acts{display:flex;gap:10px;margin-top:16px;}
  .sheet .acts button{flex:1;border:none;border-radius:14px;padding:14px;font-size:15px;
    font-weight:700;cursor:pointer;transition:.12s;}
  .sheet .acts button:active{transform:scale(.98);}
  .copy{background:var(--ink);color:#fff;}
  .close{background:var(--tint);color:var(--ink);}

  /* ---------- 响应式：平板/桌面 ---------- */
  @media(min-width:560px){
    .grid{grid-template-columns:repeat(2,1fr);}
    header h1{font-size:23px;}
  }
  @media(min-width:860px){
    :root{--maxw:920px;}
    .grid{grid-template-columns:repeat(3,1fr);}
    body{padding-bottom:100px;}
    .bar .inner{padding:0 4px;}
  }
  /* 横屏手机 */
  @media(max-height:500px) and (orientation:landscape){
    header{padding-top:12px;}
    .grid{grid-template-columns:repeat(3,1fr);}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">🍳</div>
      <div>
        <h1>早餐点单</h1>
        <p class="sub">选好想吃的，提交后自动汇总</p>
      </div>
      <div class="date" id="today"></div>
    </div>
    <div class="who">
      <span class="icon">👤</span>
      <input id="nameInput" placeholder="输入你的名字" maxlength="20">
    </div>
  </header>

  <div class="tabs" id="tabs"></div>
  <main id="menu"></main>

  <div class="bar">
    <div class="inner">
      <div class="left">
        <div class="l1" id="cnt">还没选</div>
        <div class="l2" id="picked">—</div>
      </div>
      <button id="genBtn" class="btn-ghost">菜单</button>
      <button id="submitBtn" class="btn-main">提交</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<div id="modal">
  <div class="sheet">
    <div class="handle"></div>
    <h3>📋 每日早餐菜单</h3>
    <div class="mk" id="menuText"></div>
    <div class="acts">
      <button class="close" id="closeModal">关闭</button>
      <button class="copy" id="copyBtn">复制菜单</button>
    </div>
  </div>
</div>

<script>
const API = location.pathname.startsWith('/breakfast') ? (location.origin + '/breakfast') : location.origin;
let MENU = null;
let CART = {};   // id -> qty

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1600);
}
function findItem(id){
  for(const c of MENU.categories) for(const it of c.items) if(it.id===id) return it;
  return null;
}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function renderTabs(){
  const el=document.getElementById('tabs');
  el.innerHTML='';
  for(const cat of MENU.categories){
    const b=document.createElement('button');
    b.className='tab';
    b.textContent=`${cat.icon} ${cat.name}`;
    b.onclick=()=>{
      const t=document.getElementById('cat_'+cat.id);
      if(t) t.scrollIntoView({behavior:'smooth',block:'start'});
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
    };
    el.appendChild(b);
  }
  if(el.firstChild) el.firstChild.classList.add('on');
}

function render(){
  const root=document.getElementById('menu');
  root.innerHTML='';
  for(const cat of MENU.categories){
    const sec=document.createElement('section');
    sec.className='cat';sec.id='cat_'+cat.id;
    const cnt=cat.items.reduce((a,it)=>a+(CART[it.id]||0),0);
    sec.innerHTML=`<h2><span class="dot"></span>${cat.icon} ${cat.name}${cnt?`<span class="badge">已选 ${cnt}</span>`:''}</h2>`;
    const grid=document.createElement('div');
    grid.className='grid';
    for(const it of cat.items){
      const q=CART[it.id]||0;
      const el=document.createElement('div');
      el.className='item'+(q>0?' on':'');
      el.innerHTML=`
        <div class="thumb">${it.emoji||'🍽'}</div>
        <div class="info">
          <div class="nm">${esc(it.name)}</div>
          <div class="ds">${esc(it.desc||'')}</div>
        </div>
        <div class="stepper">
          <button class="minus" ${q>0?'':'style="visibility:hidden"'}>−</button>
          <span class="q">${q>0?q:''}</span>
          <button class="plus">+</button>
        </div>`;
      el.querySelector('.plus').onclick=(e)=>{e.stopPropagation();addItem(it);};
      el.querySelector('.minus').onclick=(e)=>{e.stopPropagation();
        if(CART[it.id]){CART[it.id]--;if(CART[it.id]<=0)delete CART[it.id];render();}};
      el.onclick=()=>addItem(it);
      grid.appendChild(el);
    }
    sec.appendChild(grid);
    root.appendChild(sec);
  }
  updateBar();
}

function addItem(it){
  if(it.id==='o1'){
    const v=prompt('想吃什么？（输入菜名）','');
    if(!v||!v.trim())return;
    const k='c_'+v.trim();
    CART[k]=(CART[k]||0)+1;render();return;
  }
  CART[it.id]=(CART[it.id]||0)+1;render();
}

function cartList(){
  const arr=[];
  for(const id in CART){
    if(id.startsWith('c_')){arr.push({id,name:id.slice(2),emoji:'✍️',price:0,qty:CART[id]});continue;}
    const it=findItem(id);
    if(it) arr.push({id,name:it.name,emoji:it.emoji||'🍽',price:it.price||0,qty:CART[id]});
  }
  return arr;
}

function updateBar(){
  const list=cartList();
  const n=list.reduce((a,b)=>a+b.qty,0);
  document.getElementById('cnt').textContent=n?`已选 ${n} 样`:'还没选';
  const names=list.map(x=>x.qty>1?`${x.name}×${x.qty}`:x.name).join('、');
  document.getElementById('picked').textContent=names||'—';
}

async function submit(){
  const name=document.getElementById('nameInput').value.trim();
  if(!name){toast('请先填写名字');return;}
  const items=cartList();
  if(!items.length){toast('请至少选一样早餐');return;}
  try{
    const r=await fetch(API+'/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name,items})});
    const d=await r.json();
    if(!d.ok){toast(d.error||'提交失败');return;}
    toast('✅ 提交成功！');
    CART={};render();
    showMenu(d.daily_menu);
  }catch(e){toast('网络错误，请重试');}
}

function menuToText(m){
  let s=`🍳 每日早餐菜单 (${m.date})\n`;
  s+=`👥 ${m.total_people} 人 · ${m.total_items} 份\n`;
  s+=`——————\n`;
  if(!m.summary.length){s+='（还没有人点单）\n';return s;}
  for(const it of m.summary) s+=`${it.emoji||'🍽'} ${it.name} ×${it.qty}\n`;
  s+=`——————\n👤 各人明细：\n`;
  for(const p of m.per_person){
    const list=p.items.map(i=>`${i.name}${i.qty>1?'×'+i.qty:''}`).join('、');
    s+=`· ${p.name}：${list}\n`;
  }
  return s;
}

function showMenu(m){
  const fill=(mm)=>{
    document.getElementById('menuText').textContent=menuToText(mm);
    document.getElementById('modal').classList.add('show');
  };
  if(m) fill(m);
  else fetch(API+'/api/daily-menu').then(r=>r.json()).then(fill);
}

document.getElementById('today').textContent=
  new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'short'});
document.getElementById('submitBtn').onclick=submit;
document.getElementById('genBtn').onclick=()=>showMenu(null);
document.getElementById('closeModal').onclick=()=>document.getElementById('modal').classList.remove('show');
document.getElementById('modal').onclick=(e)=>{if(e.target.id==='modal')e.currentTarget.classList.remove('show');};
document.getElementById('copyBtn').onclick=async()=>{
  const txt=document.getElementById('menuText').textContent;
  try{await navigator.clipboard.writeText(txt);toast('已复制菜单');}
  catch(e){toast('长按文本手动复制');}
};

const saved=localStorage.getItem('bf_name');
if(saved) document.getElementById('nameInput').value=saved;
document.getElementById('nameInput').addEventListener('change',e=>localStorage.setItem('bf_name',e.target.value.trim()));

fetch(API+'/api/menu').then(r=>r.json()).then(d=>{MENU=d.menu;renderTabs();render();});
</script>
</body>
</html>
