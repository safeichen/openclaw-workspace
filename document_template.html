<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>文档模板</title>
    <style>
        @page {
            size: A4;
            margin: 2.54cm;
        }
        body {
            font-family: "SimSun", "宋体", serif;
            line-height: 1.5;
        }
        .title {
            text-align: center;
            font-family: "SimHei", "黑体", sans-serif;
            font-size: 18pt; /* 小二 */
            font-weight: bold;
            margin-bottom: 40pt;
        }
        .info {
            text-align: right;
            font-size: 12pt; /* 小四 */
            margin-bottom: 30pt;
            line-height: 1.8;
        }
        .content {
            font-size: 12pt; /* 小四 */
            line-height: 1.5;
            text-align: justify;
            margin-bottom: 30pt;
        }
        .comment {
            font-size: 12pt; /* 小四 */
            line-height: 1.5;
            color: black;
            font-family: "SimSun", "宋体", serif;
        }
        .section {
            margin-bottom: 20pt;
        }
    </style>
</head>
<body>
    <div class="title">【请在此处填写标题】</div>
    
    <div class="info">
        学校：________________________<br>
        姓名：________________________<br>
        辅导老师：____________________
    </div>
    
    <div class="content">
        <div class="section">
            【请在此处填写正文内容...】
        </div>
        
        <div class="section">
            【正文第二段（如有）...】
        </div>
        
        <div class="section">
            【正文第三段（如有）...】
        </div>
    </div>
    
    <div class="comment">
        <strong>评语：</strong><br>
        【请在此处填写评语内容...】
    </div>
</body>
</html>
